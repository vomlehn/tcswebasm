# Builds the page and publishes it as the GitHub Pages site,
# https://vomlehn.github.io/tcswebasm/, on every push to main and by hand:
# run it by hand to publish a change to tcspecial.
#
# The page's WebAssembly is built, not committed: web/pkg is ignored. It is
# built from tcspecial's main, checked out beside this repository as it is
# for `make build` at home, with the dated nightly named below and the
# wasm-bindgen that Cargo.lock names. Pages cannot send the headers that
# let the page share memory between threads; web/coi.js, the page's service
# worker, adds them. It is published only once check-page.mjs, in headless
# Chrome, has seen it start every example; once it is published, the tidy
# job deletes the build caches and uploads of the page that the next run
# will not need.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  NIGHTLY: nightly-2026-10-20

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      # The build cache this run used, which tidy keeps.
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tcswebasm
      - uses: actions/checkout@v7
        with:
          repository: vomlehn/tcspecial
          path: tcspecial
      - name: Install the nightly toolchain
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal \
              --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-bindgen
        working-directory: tcswebasm
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock |
              sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install --locked wasm-bindgen-cli --version "$version"
      # The build cache's name, named once so that tidy keeps it.
      - id: key
        run: |
          echo "key=wasm-$NIGHTLY-${{ hashFiles('tcswebasm/Cargo.lock') }}" \
              >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            tcswebasm/target
          key: ${{ steps.key.outputs.key }}
      - name: Build the page
        working-directory: tcswebasm
        run: make build NIGHTLY="$NIGHTLY"
      # Not published unless every example starts, served as Pages
      # will serve it: see check-page.mjs.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check that the page starts each example
        working-directory: tcswebasm
        run: make page-check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: tcswebasm/web
      - id: deployment
        uses: actions/deploy-pages@v5

  # Keeps GitHub's storage to what the next run needs, once the page is
  # published: deletes every build cache but the one this run used, and every
  # earlier upload of the page. Failing here leaves the page published.
  tidy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP: ${{ needs.publish.outputs.cache-key }}
      RUN: ${{ github.run_id }}
    steps:
      - name: Delete the build caches no longer used
        run: |
          # With no name to keep, keep everything rather than nothing.
          [ -n "$KEEP" ] || { echo "no build cache named" >&2; exit 1; }
          gh cache list --limit 100 --json id,key \
              --jq ".[] | select(.key != \"$KEEP\") | .id" |
              xargs -r -n1 gh cache delete
      - name: Delete the earlier uploads of the page
        run: |
          gh api --paginate \
              "repos/$GH_REPO/actions/artifacts?name=github-pages" \
              --jq ".artifacts[] | select(.workflow_run.id != $RUN) | .id" |
              xargs -r -I{} gh api -X DELETE \
              "repos/$GH_REPO/actions/artifacts/{}"
