<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCSpecial in a Browser</title>
  <link rel="icon" href="data:,">
  <!-- Isolates the page where its server will not: see coi.js. -->
  <script src="coi.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 16px; font-family: sans-serif;
           background: Canvas; color: CanvasText; }
    /* Each program's window, on a canvas of its own: see src/lib.rs. */
    #windows { display: flex; flex-wrap: wrap; gap: 16px;
               align-items: flex-start; }
    .window { border: 1px solid GrayText; box-shadow: 0 2px 8px #0004;
              overflow-x: auto; overflow-y: hidden; }
    /* Scaled down to fit the screen by fit() below, from its top left. */
    .window canvas { display: block; transform-origin: 0 0; }
    .window[hidden] { display: none; }
  </style>
</head>
<body>
  <nav>Examples:
    <a href="?example=thermostat">Thermostat</a> ·
    <a href="?example=lander">Lunar lander</a> ·
    <a href="?example=beacon">Beacon</a> ·
    <a href="?example=tees">Tees</a> ·
    <a href="?example=minimal">Minimal</a>
  </nav>
  <p id="about"></p>
  <p id="waiting" hidden>Setting up the page; if nothing appears, load it
    again. This browser must allow service workers, which a private window
    may not.</p>
  <div id="windows"></div>
  <script type="module">
    import init from "./pkg/tcswebasm.js";
    // Long stacks, for a panic said in the console.
    Error.stackTraceLimit = 100;
    // What the page runs, as src/lib.rs picks it from the address.
    const example = new URLSearchParams(location.search).get("example");
    const about = {
      lander: "TCSpecial's lunar lander, running in this page: two " +
        "tcspecials fly it, one per axis. Fly it from tcs-sim's joystick, " +
        "or press Autoland; the ground station below sees it 1.3 s late, " +
        "as from the Earth.",
      beacon: "TCSpecial's beacon, running in this page: what a ground " +
        "station knows of a vehicle without asking it anything. Start " +
        "tcspecial and its beacons arrive; stop it and they cease.",
      tees: "TCSpecial's tees example, running in this page: a command " +
        "copied back to the ground, a reading copied aboard, and data " +
        "dropped.",
      minimal: "TCSpecial's smallest configuration, running in this page: " +
        "one payload, its telemetry going to the ground.",
    };
    document.getElementById("about").textContent = about[example] ??
      "TCSpecial's thermostat, running in this page.";
    // Each window scaled down, never up, to fit the page's width; and on a
    // touch screen to fit the screen's height too, so that each window is
    // seen whole and the page scrolls from one to the next. A window that
    // says which part of it must fit, data-fit -- tcs-sim's lander pane --
    // is scaled to fit that part, and its frame scrolls across to the rest.
    // A scale is a transform, which leaves the canvas's own size -- what
    // the window is drawn at, and what a pointer's place is measured in --
    // as it is; the frame around it is given the scaled size, for the
    // page's layout. See tcs-ui's windows::regions.
    const touch = window.matchMedia("(pointer: coarse)").matches;
    const areaOf = (said) => said ? said.split(" ").map(Number) : null;
    function fit() {
      const page = document.body;
      const style = getComputedStyle(page);
      const across = page.clientWidth - parseFloat(style.paddingLeft) -
        parseFloat(style.paddingRight) - 2;
      const down = window.innerHeight - 2 * parseFloat(style.paddingTop) - 2;
      for (const frame of document.querySelectorAll(".window")) {
        const canvas = frame.querySelector("canvas");
        const wide = canvas.offsetWidth, high = canvas.offsetHeight;
        if (frame.hidden || !wide || !high) continue;
        const part = touch && areaOf(canvas.dataset.fit);
        const [fitWide, fitHigh] = part && part[2] > 0 && part[3] > 0
          ? [part[0] + part[2], part[1] + part[3]] : [wide, high];
        let scale = Math.min(1, across / fitWide);
        if (touch) scale = Math.min(scale, down / fitHigh);
        canvas.style.transform = scale < 1 ? `scale(${scale})` : "";
        frame.style.width = `${Math.min(across, wide * scale)}px`;
        frame.style.height = `${high * scale}px`;
      }
    }
    // A touch that starts where a window is dragged in, data-hold -- the
    // lander's joystick -- is the window's; anywhere else it may scroll.
    function holding(event) {
      const canvas = event.currentTarget;
      const hold = areaOf(canvas.dataset.hold);
      if (!hold || !(hold[2] > 0)) return;
      const box = canvas.getBoundingClientRect();
      const scale = box.width / canvas.offsetWidth;
      for (const t of event.changedTouches) {
        const x = (t.clientX - box.left) / scale;
        const y = (t.clientY - box.top) / scale;
        if (x >= hold[0] && x <= hold[0] + hold[2] &&
            y >= hold[1] && y <= hold[1] + hold[3]) {
          event.preventDefault();
          return;
        }
      }
    }
    // Again whenever a window is made, shown, hidden, resized or says what
    // must fit, or the page is resized.
    const resized = new ResizeObserver(fit);
    new MutationObserver((changes) => {
      for (const change of changes) {
        for (const node of change.addedNodes) {
          const canvas = node.querySelector && node.querySelector("canvas");
          if (canvas) {
            resized.observe(canvas);
            canvas.addEventListener("touchstart", holding, { passive: false });
          }
        }
      }
      fit();
    }).observe(document.getElementById("windows"),
               { childList: true, subtree: true, attributes: true,
                 attributeFilter: ["hidden", "data-fit"] });
    window.addEventListener("resize", fit);
    // Threads need an isolated page; coi.js loads it again once it is.
    if (window.crossOriginIsolated) {
      init();
    } else {
      document.getElementById("waiting").hidden = false;
    }
  </script>
</body>
</html>
