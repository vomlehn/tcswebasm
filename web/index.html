<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCSpecial in a Browser</title>
  <link rel="icon" href="data:,">
  <!-- Isolates the page where its server will not: see coi.js. -->
  <script src="coi.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 16px; font-family: sans-serif;
           background: Canvas; color: CanvasText; }
    /* Each program's window, on a canvas of its own: see src/lib.rs. */
    #windows { display: flex; flex-wrap: wrap; gap: 16px;
               align-items: flex-start; }
    .window { border: 1px solid GrayText; box-shadow: 0 2px 8px #0004; }
    .window canvas { display: block; }
    .window[hidden] { display: none; }
  </style>
</head>
<body>
  <nav>Examples:
    <a href="?example=thermostat">Thermostat</a> ·
    <a href="?example=lander">Lunar lander</a> ·
    <a href="?example=tees">Tees</a> ·
    <a href="?example=minimal">Minimal</a>
  </nav>
  <p id="about"></p>
  <p id="waiting" hidden>Setting up the page; if nothing appears, load it
    again. This browser must allow service workers, which a private window
    may not.</p>
  <div id="windows"></div>
  <script type="module">
    import init from "./pkg/tcswebasm.js";
    // Long stacks, for a panic said in the console.
    Error.stackTraceLimit = 100;
    // What the page runs, as src/lib.rs picks it from the address.
    const example = new URLSearchParams(location.search).get("example");
    const about = {
      lander: "TCSpecial's lunar lander, running in this page: two " +
        "tcspecials fly it, one per axis. Fly it from tcs-sim's joystick, " +
        "or press Autoland; the ground station below sees it 1.3 s late, " +
        "as from the Earth.",
      tees: "TCSpecial's tees example, running in this page: a command " +
        "copied back to the ground, a reading copied aboard, and data " +
        "dropped.",
      minimal: "TCSpecial's smallest configuration, running in this page: " +
        "one payload, its telemetry going to the ground.",
    };
    document.getElementById("about").textContent = about[example] ??
      "TCSpecial's thermostat, running in this page.";
    // Threads need an isolated page; coi.js loads it again once it is.
    if (window.crossOriginIsolated) {
      init();
    } else {
      document.getElementById("waiting").hidden = false;
    }
  </script>
</body>
</html>
